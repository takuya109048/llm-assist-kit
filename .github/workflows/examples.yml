name: Examples

# marp-slides の見本 (examples/marp-slides-example.pdf / .pptx) を Windows で作り直し、
# 元が変わっていればそのブランチにコミットする。PDF にはテーマのフォント
# (メイリオ・Segoe UI) と Edge が要るので windows-latest で動かす。
# main には直接コミットしないので、見本の元を変えたら作業ブランチに push する。
on:
  push:
    branches-ignore: [main]
    paths:
      - "skills/marp-slides/example.md"
      - "skills/marp-slides/theme.css"
      - "skills/marp-slides/build.py"
      - "skills/marp-slides/editable_pptx.py"
      - "skills/marp-slides/assets/**"
      - "skills/marp-slides/marp.zip"
      - "examples/marp-slides-example.*"
      - "tools/build_examples.py"
      - ".github/workflows/examples.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: examples-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref != 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build examples
        run: python tools/build_examples.py
      - name: Commit examples
        shell: bash
        run: |
          git add examples/marp-slides-example.pdf examples/marp-slides-example.pptx examples/marp-slides-example.inputs
          if git diff --cached --quiet; then
            echo "見本は最新です"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "marp-slides の見本 (PDF / PPTX) を作り直す"
          git push origin "HEAD:${GITHUB_REF_NAME}"
